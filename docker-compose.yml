# docker-compose.yml
# Defines and connects all services needed to run the application.
# Right now we only have one service (the API), but this structure
# makes it easy to add Redis, PostgreSQL, or a frontend later.

version: "3.9"

services:
  api:
    # Build from the Dockerfile in the current directory
    build: .

    # Name the container for easy identification in docker ps
    container_name: langchain-copilot-api

    # Map host port 8000 to container port 8000
    # Format: "host_port:container_port"
    ports:
      - "8000:8000"

    # Mount a volume for ChromaDB persistence.
    # Without this, ChromaDB data lives inside the container and
    # disappears every time you restart or rebuild.
    # Format: "host_path:container_path"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data

    # Load environment variables from .env file.
    # These are injected into the container's environment at runtime.
    # The .env file itself is NOT copied into the image — it stays on your machine.
    # This is the correct security pattern: secrets never enter the image.
    env_file:
      - .env

    # Restart the container automatically if it crashes.
    # "unless-stopped" means restart on crash but not when you manually stop it.
    restart: unless-stopped

    # Health check — Docker will ping /health every 30 seconds.
    # If it fails 3 times, Docker marks the container as unhealthy.
    # This is how orchestration systems know your service is ready.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s